<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="top-strip ok" id="top-strip"></div>

  <header class="app-topbar">
    <div class="app-topbar-left">
      <span class="app-brand">Qafila</span>
      <span class="app-page-title">Manager Dashboard</span>
    </div>
    <div class="app-topbar-right">
      <span class="app-manager" id="manager-name">—</span>
      <button class="btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <section class="status-strip">
    <div class="status-cell">
      <div class="k">Active shifts</div>
      <div class="v" id="stat-active-shifts">0</div>
    </div>
    <div class="status-cell">
      <div class="k">Active alerts</div>
      <div class="v" id="stat-active-alerts">0</div>
    </div>
    <div class="status-cell">
      <div class="k">Predictive alerts</div>
      <div class="v" id="stat-predictions">0</div>
    </div>
    <div class="status-cell">
      <div class="k">Connection</div>
      <div class="v" id="stat-connection">Disconnected</div>
    </div>
  </section>

  <main class="app-layout">

    <section>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Vehicles on shift</div>
          <div class="panel-count" id="vehicle-count">0</div>
        </div>
        <div id="vehicle-grid" class="vehicle-grid">
          <p class="empty">No active shifts.</p>
        </div>
      </div>
    </section>

    <aside style="display:flex; flex-direction:column; gap:16px;">

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Live alerts</div>
          <div class="panel-count" id="alerts-count">0</div>
        </div>
        <div id="alerts-list" class="alert-list">
          <p class="empty">No alerts.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Maintenance predictions</div>
          <div class="panel-count" id="predictions-count">0</div>
        </div>
        <div id="predictions-list" class="prediction-list">
          <p class="empty">No predictions.</p>
        </div>
      </div>

    </aside>

  </main>

  <div id="popup-root" class="popup-root"></div>

  <script src="https://qafila-backend.onrender.com/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
