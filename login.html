<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Sign in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="top-strip ok"></div>

  <div class="auth-wrap">
    <div style="width:100%; max-width:800px;">
      <div class="auth-brand">
        <h1>Qafila</h1>
        <p>Fleet Management System</p>
      </div>

      <!-- Sign in + Register side by side (register hides after first manager) -->
      <div class="auth-grid" id="auth-grid">

        <!-- SIGN IN -->
        <div class="auth-card">
          <h2>Sign in</h2>
          <p class="auth-sub">Access your manager dashboard</p>

          <form id="login-form" autocomplete="on">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="username" />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password" />

            <button type="submit" id="login-btn">Sign in</button>

            <p id="login-error" class="auth-error" hidden></p>
          </form>
        </div>

        <!-- REGISTER (only shown if no manager exists) -->
        <div class="auth-card" id="register-card">
          <h2>Create account</h2>
          <p class="auth-sub">Set up the first manager account</p>

          <form id="register-form" autocomplete="on">
            <label for="reg-name">Full name</label>
            <input type="text" id="reg-name" required autocomplete="name" />

            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required autocomplete="email" />

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required minlength="8" autocomplete="new-password" />

            <label for="reg-password2">Confirm password</label>
            <input type="password" id="reg-password2" required minlength="8" autocomplete="new-password" />

            <button type="submit" id="register-btn">Create account</button>

            <p id="register-error" class="auth-error" hidden></p>
            <p id="register-success" class="auth-success" hidden></p>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
