<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Shifts</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body class="app-body">

  <div class="top-strip ok" id="top-strip"></div>

  <div class="app-shell">

     <aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
    <span class="sidebar-brand-text">Qafila</span>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Fleet</div>
    <a href="../index.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Dashboard</span>
    </a>
    <a href="operations.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Operations</span>
    </a>
    <a href="drivers.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Drivers</span>
    </a>
    <a href="vehicles.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Vehicles</span>
    </a>
    <a href="shifts.html" class="sidebar-link active">
      <span class="sidebar-link-mark"></span><span>Shifts</span>
    </a>

    <div class="sidebar-section-label">Insights</div>
    <a href="predictions.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Predictions</span>
    </a>

    <div class="sidebar-section-label">System</div>
    <a href="import.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Import</span>
    </a>
    <a href="settings.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <div class="sidebar-live">
      <span class="sidebar-live-dot" id="sidebar-live-dot"></span>
      <span class="sidebar-live-text" id="sidebar-live-text">Connecting…</span>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" id="manager-name">—</div>
      <div class="sidebar-user-role">Manager</div>
    </div>
    <button class="sidebar-logout" id="logout-btn">Log out</button>
  </div>
</aside>

    <main class="main-area">

      <header class="main-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>

        <div class="main-topbar-title">
          <div class="main-topbar-page">Shifts</div>
          <div class="main-topbar-date" id="hero-date">—</div>
        </div>

        <div class="main-topbar-right">
          <div class="main-clock" id="hero-time">--:--:--</div>
          <span class="hero-pill ok" id="hero-pill">
            <span class="hero-pill-dot"></span>
            <span class="hero-pill-text" id="hero-pill-text">Ready</span>
          </span>
        </div>
      </header>

      <section class="ops-wrap">

        <!-- Filters -->
        <div class="shifts-filters">
          <div class="filter-field">
            <label for="f-driver">Driver</label>
            <select id="f-driver">
              <option value="">All drivers</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="f-vehicle">Vehicle</label>
            <select id="f-vehicle">
              <option value="">All vehicles</option>
            </select>
          </div>

          <div class="filter-field">
            <label for="f-from">From</label>
            <input type="date" id="f-from" />
          </div>

          <div class="filter-field">
            <label for="f-to">To</label>
            <input type="date" id="f-to" />
          </div>

          <div class="filter-field">
            <button class="btn" id="f-clear">Clear</button>
          </div>

          <div class="filter-field filter-check">
            <label class="switch">
              <input type="checkbox" id="f-active" />
              <span class="switch-label">Active only</span>
            </label>
          </div>
        </div>

        <!-- Shifts table -->
        <div class="dash-panel">
          <div class="panel-head">
            <div class="panel-title">All shifts</div>
            <div class="panel-count" id="shifts-count">0</div>
          </div>

          <div id="shifts-table-wrap" class="shift-table-wrap">
            <p class="empty">Loading…</p>
          </div>
        </div>

      </section>

    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/shifts.js"></script>
</body>
</html>
