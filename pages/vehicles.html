<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Vehicles</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body class="app-body">

  <div class="top-strip ok" id="top-strip"></div>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
    <span class="sidebar-brand-text">Qafila</span>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Fleet</div>
    <a href="index.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Dashboard</span>
    </a>
    <a href="operations.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Operations</span>
    </a>
    <a href="drivers.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Drivers</span>
    </a>
    <a href="vehicles.html" class="sidebar-link active">
      <span class="sidebar-link-mark"></span><span>Vehicles</span>
    </a>
    <a href="shifts.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Shifts</span>
    </a>

    <div class="sidebar-section-label">Insights</div>
    <a href="predictions.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Predictions</span>
    </a>

    <div class="sidebar-section-label">System</div>
    <a href="import.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Import</span>
    </a>
    <a href="settings.html" class="sidebar-link ">
      <span class="sidebar-link-mark"></span><span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <div class="sidebar-live">
      <span class="sidebar-live-dot" id="sidebar-live-dot"></span>
      <span class="sidebar-live-text" id="sidebar-live-text">Connecting…</span>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" id="manager-name">—</div>
      <div class="sidebar-user-role">Manager</div>
    </div>
    <button class="sidebar-logout" id="logout-btn">Log out</button>
  </div>
</aside>

    <main class="main-area">

      <header class="main-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>

        <div class="main-topbar-title">
          <div class="main-topbar-page">Vehicles</div>
          <div class="main-topbar-date" id="hero-date">—</div>
        </div>

        <div class="main-topbar-right">
          <div class="main-clock" id="hero-time">--:--:--</div>
          <span class="hero-pill ok" id="hero-pill">
            <span class="hero-pill-dot"></span>
            <span class="hero-pill-text" id="hero-pill-text">Ready</span>
          </span>
        </div>
      </header>

      <section class="main-section" style="padding-top:24px;">
        <div class="app-layout page-single" style="padding:0;">

          <div class="panel">
            <div class="panel-head">
              <div class="panel-title">Add vehicle</div>
            </div>

            <form id="vehicle-form" class="form-grid">
              <div class="form-row">
                <label for="v-plate">Plate number</label>
                <input type="text" id="v-plate" required placeholder="12345" />
              </div>

              <div class="form-row">
                <label for="v-make">Make</label>
                <input type="text" id="v-make" placeholder="Toyota" />
              </div>

              <div class="form-row">
                <label for="v-model">Model</label>
                <input type="text" id="v-model" placeholder="Hiace" />
              </div>

              <div class="form-row">
                <label for="v-year">Year</label>
                <input type="number" id="v-year" placeholder="2020" min="1980" max="2100" />
              </div>

              <div class="form-row">
                <label for="v-node">Node ID</label>
                <input type="text" id="v-node" placeholder="NODE-001" />
                <div class="form-hint">The Arduino's identifier. Must match the firmware.</div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="vehicle-submit">Add vehicle</button>
                <p id="vehicle-error" class="auth-error" hidden></p>
                <p id="vehicle-success" class="auth-success" hidden></p>
              </div>
            </form>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div class="panel-title">All vehicles</div>
              <div class="driver-list-controls">
                <label class="switch">
                  <input type="checkbox" id="show-inactive-toggle" />
                  <span class="switch-label">Show inactive</span>
                </label>
                <div class="panel-count" id="vehicle-count">0</div>
              </div>
            </div>
            <div id="vehicle-list" class="data-list">
              <p class="empty">Loading…</p>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/vehicles.js"></script>
</body>
</html>
