<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Shift Report</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Qafila</span>
      <span class="brand-sub">Shift Report</span>
    </div>
    <div class="topbar-right">
      <span id="manager-name" class="manager-name">—</span>
      <a href="index.html" class="btn-secondary" style="text-decoration:none;">Back</a>
      <button id="logout-btn" class="btn-secondary">Log out</button>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr;">

    <section>
      <h2 class="section-title">Shift</h2>
      <div id="shift-meta" class="panel">
        <p class="empty">Loading…</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Driver behavior summary</h2>
      <div id="behavior-panel" class="panel">
        <p class="empty">Loading…</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Events</h2>
      <div id="events-panel" class="panel">
        <p class="empty">No events.</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Alerts during this shift</h2>
      <div id="alerts-panel" class="panel">
        <p class="empty">No alerts.</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Maintenance predictions for this vehicle</h2>
      <div id="predictions-panel" class="panel">
        <p class="empty">No predictions.</p>
      </div>
    </section>

  </main>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shift.js"></script>
</body>
</html>
