<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qafila — Shift Report</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="top-strip ok"></div>

  <header class="app-topbar">
    <div class="app-topbar-left">
      <span class="app-brand">Qafila</span>
      <span class="app-page-title">Shift Report</span>
    </div>
    <div class="app-topbar-right">
      <span class="app-manager" id="manager-name">—</span>
      <a href="index.html" class="btn" style="text-decoration:none;">Back</a>
      <button class="btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="shift-wrap">

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Shift</div>
      </div>
      <div id="shift-meta" class="kv-list">
        <p class="empty">Loading…</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Driver behavior summary</div>
      </div>
      <div id="behavior-panel">
        <p class="empty">Loading…</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Events</div>
      </div>
      <div id="events-panel" class="alert-list">
        <p class="empty">No events.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Alerts during this shift</div>
      </div>
      <div id="alerts-panel" class="alert-list">
        <p class="empty">No alerts.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Maintenance predictions for this vehicle</div>
      </div>
      <div id="predictions-panel" class="prediction-list">
        <p class="empty">No predictions.</p>
      </div>
    </div>

  </main>

  <script src="https://qafila-backend.onrender.com/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shift.js"></script>
</body>
</html>
